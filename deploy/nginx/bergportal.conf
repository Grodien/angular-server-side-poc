# Nginx site config for Bergportal.
# Place at /etc/nginx/sites-available/bergportal and symlink into sites-enabled.
#
# Terminates TLS and reverse-proxies to the Angular SSR server on 127.0.0.1:4000.
# The API (127.0.0.1:3000) and PostgreSQL are NOT exposed here; only the SSR
# server is reachable from the internet.

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Allow ACME HTTP-01 challenges (certbot) before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # TLS certificates (adjust paths; e.g. Let's Encrypt / certbot).
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reasonable body size for form posts / API bodies.
    client_max_body_size 5m;

    # Reverse proxy to the Angular SSR server.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # OPTIONAL: The SSR server exposes a transparent /api pass-through proxy that
    # does NOT inject the API key. If you do not want it reachable from the
    # internet, uncomment the block below to block it at the edge.
    #
    # location /api/ {
    #     return 404;
    # }
}
